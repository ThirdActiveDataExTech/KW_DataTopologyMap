# 세션 저장소용 Redis (SESSION_STORE_TYPE=redis 일 때만 필요). 단일 인스턴스, 비영속.
# application-kube.yml 의 REDIS_NODES 기본값(thirdeye-redis-svc:6379)과 서비스 이름을 맞춘다.
apiVersion: v1
kind: Service
metadata:
  name: thirdeye-redis-svc
  labels:
    app: thirdeye-redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: thirdeye-redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thirdeye-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thirdeye-redis
  template:
    metadata:
      labels:
        app: thirdeye-redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          args: ["--save", "", "--appendonly", "no"]  # 세션 캐시 용도라 디스크 영속화 없음
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 10
