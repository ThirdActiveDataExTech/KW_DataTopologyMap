apiVersion: v1
kind: Secret
metadata:
  name: thirdeye-db-secret
  namespace: thirdeye
type: Opaque
stringData:
  # Base64 인코딩을 자동으로 처리해주는 stringData 사용
  # 아래 값은 샘플입니다. 적용 전에 반드시 실제 계정명과 안전한 비밀번호로 바꾸세요.
  POSTGRES_SUPER_PASSWORD: superadmin_password_here
  DB_USERNAME: thirdeye_app
  DB_PASSWORD: CHANGE_ME_BEFORE_APPLY
