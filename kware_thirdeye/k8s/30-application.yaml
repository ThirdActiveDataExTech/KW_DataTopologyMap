apiVersion: v1
kind: Service
metadata:
  name: thirdeye-app-svc
  labels:
    app: thirdeye-app
spec:
  type: NodePort # 외부 브라우저 접속을 위해 NodePort로 변경
  externalTrafficPolicy: Cluster
  ports:
    - port: 9094
      targetPort: 9094
      nodePort: 30094 # 웹 접속용 포트 지정 (VM-IP:30094)
  selector:
    app: thirdeye-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thirdeye-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thirdeye-app
  template:
    metadata:
      labels:
        app: thirdeye-app
    spec:
      containers:
        - name: thirdeye-app
          image: rnd.kware.co.kr/kware-thirdeye:0.2.0 
          imagePullPolicy: Always
          ports:
            - containerPort: 9094
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "1"
              memory: "1536Mi"
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kube"
            - name: DB_HOST
              value: "thirdeye-db-svc" 
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: thirdeye-db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: thirdeye-db-secret
                  key: DB_PASSWORD
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: thirdeye-db-secret
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: thirdeye-db-secret
                  key: MAIL_PASSWORD
            - name: REDIS_NODES
              value: "thirdeye-redis-svc:6379" 
            - name: MOBIGEN_URL
              value: "http://mobigen-api.example.internal:30080/v1"  # 실제 모비젠 API 주소로 교체
            - name: TZ
              value: Asia/Seoul
          # /actuator/health 는 인증 없이 응답하도록 보안 설정에서 허용한다.
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 9094
            periodSeconds: 10
            failureThreshold: 30   # 최대 5분 기동 대기
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9094
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9094
            periodSeconds: 20
          volumeMounts:
            - name: app-data
              mountPath: /app/data
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: app-data-pvc
